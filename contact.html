tact#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://minuterush-github.cokso344.workers.dev/"},{"@type":"ListItem","position":2,"name":"Contact","item":"https://minuterush-github.cokso344.workers.dev/contact"}]}]}</script></head><body><div class="wrap"><a class="brand" href="./">Minute<span>Rush</span> ⚡</a><nav aria-label="Main navigation"><a href="./">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy Policy</a></nav><main class="panel"><h1>Contact Us</h1><p>Have feedback, a question, or found a bug? Use this form to prepare an email to the MinuteRush team.</p><form id="contactForm"><label for="name">Your name (optional)</label><input id="name" name="name" autocomplete="name" maxlength="100"><label for="email">Your email (optional)</label><input id="email" name="email" type="email" autocomplete="email" maxlength="200"><label for="message">Message</label><textarea id="message" name="message" required maxlength="3000" placeholder="Tell us what's on your mind…"></textarea><button type="submit">Prepare email</button></form><p class="note">This form opens your device's email app; it does not send or store messages on this website.</p></main><footer>One Minute. One Challenge.</footer></div><script>
